<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpolygon fill=%27%23D8232A%27 points=%2732,4 39.5,24 60,24.5 44,37.5 49.5,58 32,46 14.5,58 20,37.5 4,24.5 24.5,24%27/%3E%3C/svg%3E">
<title>冬戀北海道　家族旅行特輯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Noto+Serif+TC:wght@400;700;900&display=swap">
<style>
/* ===== 1. Tokens ===== */
:root {
  --paper: #EEF1F2;
  --ink: #1E2A4A;
  --red: #D8232A;
  --red-text: #C01E25;   /* red for small text: AA on --paper */
  --mustard: #F0B323;
  --pink: #F2A7B8;
  --mist: #8FB3D9;
  --badge-ink: #1E2A4A;  /* fixed: badges stay mustard in both schemes */
  --rule: rgba(30, 42, 74, 0.25);
  --font-cjk: "Noto Serif TC", "Noto Serif CJK TC", "PMingLiU", "Songti TC", serif;
  --font-num: "Bodoni Moda", "Noto Serif TC", "Noto Serif CJK TC", "PMingLiU", "Songti TC", serif;
  --gutter: 16px;
  --col: 720px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16203A;
    --ink: #EEF1F2;
    --red-text: #FF7A80;  /* lighter red keeps 4.5:1 on indigo */
    --rule: rgba(238, 241, 242, 0.3);
  }
}

/* ===== 2. Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-cjk);
  font-weight: 400;
  font-size: 18px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-weight: 600; }
:focus-visible { outline: 3px solid var(--red-text); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--gutter); }

/* ===== 3. Cover ===== */
.cover {
  --cover-paper: #EEF1F2;  /* the cover is printed stock: same in dark mode */
  --cover-ink: #1E2A4A;
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: 20px var(--gutter) 16px;
  background: var(--cover-paper);
  color: var(--cover-ink);
  overflow: hidden;
}
.cover-inner { position: relative; z-index: 2; width: 100%; max-width: 960px; margin: 0 auto; flex: 1 1 auto; display: flex; flex-direction: column; }
.masthead-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 16px; }
.masthead {
  font-weight: 900;
  font-size: clamp(56px, 17.5vw, 150px);
  line-height: 1.05;
  color: var(--red);
}
.issue { display: flex; flex-direction: column; font-size: 16px; line-height: 1.5; padding-bottom: 10px; }
.issue-no { font-weight: 700; }
.cover-main {
  flex: 1 1 auto; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr;
  gap: 12px; margin-top: 16px;
}
.cover-main .coverlines { grid-column: 1; grid-row: 1; }
.cover-main .cover-headline { grid-column: 2; grid-row: 1; }
.cover-main .art { grid-column: 1 / -1; grid-row: 2; }
.coverlines { display: flex; flex-direction: column; gap: 6px; text-align: left; }
.coverlines li { font-weight: 900; line-height: 1.25; }
.coverlines li:nth-child(1) { font-size: 28px; }
.coverlines li:nth-child(2) { font-size: 21px; }
.coverlines li:nth-child(3) { font-size: 25px; color: var(--red-text-fixed, #C01E25); }
.coverlines li:nth-child(4) { font-size: 19px; }
.coverlines li:nth-child(5) { font-size: 23px; }
.coverlines li:nth-child(6) { font-size: 20px; }
.cover-headline {
  writing-mode: vertical-rl;
  font-weight: 900;
  font-size: clamp(56px, 17vw, 140px);
  line-height: 1.1;
  letter-spacing: 0.04em;
  margin-right: 4px;
}
.art { position: relative; min-height: 200px; margin: 8px calc(var(--gutter) * -1) 0; }
.layer { position: absolute; inset: 0; }
.layer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.layer-pink { mix-blend-mode: multiply; transform: translate(3px, 2px); }
.dots {
  position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent);
  mask-image: linear-gradient(to top, #000 10%, transparent);
}
.layer-mist .dots {
  background-image: radial-gradient(circle at center, var(--mist) 0 3px, transparent 3.6px);
  background-size: 12px 12px;
}
.layer-pink .dots {
  background-image: radial-gradient(circle at center, var(--pink) 0 2.4px, transparent 3px);
  background-size: 12px 12px;
  background-position: 6px 6px;
}
.cover-foot { position: relative; z-index: 2; font-size: 16px; line-height: 1.6; padding-top: 10px; max-width: 960px; width: 100%; margin: 0 auto; font-weight: 700; }
/* Desktop: one-viewport cover; grid = coverlines | illustration | vertical title */
@media (min-width: 1024px) {
  .cover { min-height: 0; height: min(100vh, 900px); height: min(100svh, 900px); }
  .cover-inner, .cover-foot { max-width: 1100px; }
  .cover-main { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); gap: 24px; }
  .cover-main .coverlines { grid-column: 1; grid-row: 1; }
  .cover-main .art { grid-column: 2; grid-row: 1; align-self: end; width: 100%; aspect-ratio: 400 / 220; max-height: 100%; min-height: 0; margin: 0; }
  .cover-main .cover-headline { grid-column: 3; grid-row: 1; font-size: 120px; }
}
@media (prefers-reduced-motion: no-preference) {
  .layer-pink { animation: reg-pink 600ms cubic-bezier(.2, .7, .2, 1) 1 both; }
  .layer-mist { animation: reg-mist 600ms cubic-bezier(.2, .7, .2, 1) 1 both; }
}
@keyframes reg-pink { from { transform: translate(-28px, 14px); opacity: 0; } to { transform: translate(3px, 2px); opacity: 1; } }
@keyframes reg-mist { from { transform: translate(24px, -10px); opacity: 0; } to { transform: translate(0, 0); opacity: 1; } }

/* ===== 4. Flights ===== */
.flights { padding-top: 32px; padding-bottom: 8px; }
.section-title { font-weight: 900; font-size: 26px; line-height: 1.4; margin-bottom: 12px; }
.tickets { display: grid; gap: 20px; }
.ticket { color: #1E2A4A; filter: drop-shadow(0 0 0 transparent); }
.ticket-main, .ticket-stub { background: var(--mist); padding: 14px 18px; }
.ticket-main {
  border-radius: 10px 10px 0 0;
  -webkit-mask: radial-gradient(circle 10px at 0 100%, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 10px at 100% 100%, #0000 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 10px at 0 100%, #0000 97%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 10px at 100% 100%, #0000 97%, #000) right / 51% 100% no-repeat;
}
.ticket-stub {
  border-radius: 0 0 10px 10px;
  position: relative;
  -webkit-mask: radial-gradient(circle 10px at 0 0, #0000 97%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 10px at 100% 0, #0000 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 10px at 0 0, #0000 97%, #000) left / 51% 100% no-repeat,
        radial-gradient(circle 10px at 100% 0, #0000 97%, #000) right / 51% 100% no-repeat;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
}
.ticket-stub::before { content: ""; position: absolute; top: 0; left: 14px; right: 14px; border-top: 2px dashed rgba(30, 42, 74, 0.45); }
.ticket-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 17px; }
.ticket-legs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 4px; }
.leg { display: flex; flex-direction: column; line-height: 1.3; }
.leg-to { text-align: right; }
.leg-time { font-family: var(--font-num); font-weight: 700; font-size: 34px; }
.leg-code { font-family: var(--font-num); font-weight: 600; font-size: 17px; }
.leg-city { font-size: 16px; }
.leg-line { width: 36px; border-top: 2px solid #1E2A4A; position: relative; }
.leg-line::after { content: ""; position: absolute; right: -1px; top: -6px; border: 5px solid transparent; border-left: 8px solid #1E2A4A; border-right: 0; }
.flight-no { font-family: var(--font-num); font-weight: 800; font-size: 22px; }
.airline { font-size: 17px; }

/* ===== 5. Tools and day navigation ===== */
.tools { display: flex; justify-content: flex-end; padding-top: 12px; padding-bottom: 12px; }
.btn {
  min-height: 44px; min-width: 44px; padding: 8px 20px;
  background: transparent; border: 2px solid var(--ink); border-radius: 22px;
  font-weight: 700; font-size: 17px; cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.daynav {
  position: sticky; top: 0; z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.daynav-list { display: flex; max-width: var(--col); margin: 0 auto; padding: 0 4px; }
.daynav-btn {
  position: relative; flex: 1 1 0; min-width: 0; min-height: 52px;
  padding: 4px 2px 6px; background: transparent; border: 0; border-bottom: 4px solid transparent;
  cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
  line-height: 1.3; font-size: 15px;
}
.daynav-btn .nav-day { font-weight: 900; }
.daynav-btn .nav-date { font-family: var(--font-num); font-weight: 600; font-size: 15px; white-space: nowrap; }
.daynav-btn[aria-current="true"] { border-bottom-color: var(--red); }
.daynav-btn[aria-current="true"] .nav-day { color: var(--red-text); }
.today-mark {
  position: absolute; top: 0; right: 0; padding: 0 5px; font-size: 12px; line-height: 1.5; font-weight: 700;
  background: var(--mustard); color: var(--badge-ink); border-radius: 0 0 0 6px;
}

/* ===== 6. Day sections ===== */
.day { padding-top: 40px; padding-bottom: 24px; scroll-margin-top: 56px; }
.day-head { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; align-items: end; margin-bottom: 20px; }
.day-numeral { grid-row: 1 / span 2; font-family: var(--font-num); font-weight: 800; font-size: 96px; line-height: 0.9; color: var(--red-text); }
.day-label { font-weight: 900; font-size: 18px; line-height: 1.4; }
.day-date { font-family: var(--font-num); font-weight: 700; font-size: 24px; line-height: 1.3; }
.day-route { grid-column: 1 / -1; margin-top: 12px; font-weight: 700; max-width: 36em; }

/* Timeline */
.timeline { position: relative; padding-left: 30px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 14px; bottom: 14px; width: 2px; background: var(--red); }
.stop { position: relative; break-inside: avoid; }
.stop::before {
  content: ""; position: absolute; left: -30px; top: 27px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--red);
}
.stop summary {
  display: flex; align-items: center; gap: 12px;
  min-height: 56px; padding: 6px 28px 6px 0; cursor: pointer; list-style: none; position: relative;
  font-weight: 900; font-size: 19px; line-height: 1.5;
}
.stop summary::-webkit-details-marker { display: none; }
.stop summary::after {
  content: ""; position: absolute; right: 6px; top: 50%; width: 9px; height: 9px;
  border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink);
  transform: translateY(-70%) rotate(45deg);
}
.stop[open] summary::after { transform: translateY(-30%) rotate(-135deg); }
.stop-title { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
/* Postage stamp: outer span tilts and casts the shadow, inner face is masked into perforations */
.stamp { flex: none; width: 56px; height: 56px; transform: rotate(-1.5deg); filter: drop-shadow(0 1px 1px rgba(30, 42, 74, 0.35)); }
.timeline > li:nth-child(even) .stamp { transform: rotate(1.5deg); }
.stamp-face {
  display: block; width: 100%; height: 100%; padding: 5px; background: #FBF8EF;
  -webkit-mask: linear-gradient(#000 0 0) 4px 4px / calc(100% - 8px) calc(100% - 8px) no-repeat,
                radial-gradient(circle at 50% 50%, #0000 2.6px, #000 3.1px) -4px -4px / 8px 8px;
  mask: linear-gradient(#000 0 0) 4px 4px / calc(100% - 8px) calc(100% - 8px) no-repeat,
        radial-gradient(circle at 50% 50%, #0000 2.6px, #000 3.1px) -4px -4px / 8px 8px;
}
.stamp-art { display: block; width: 100%; height: 100%; }
.badge {
  display: inline-block; padding: 0 8px; border-radius: 4px; font-size: 13px; line-height: 1.7; font-weight: 700;
  background: var(--mustard); color: var(--badge-ink);
}
.badge-quiet { background: transparent; color: var(--ink); border: 1px solid var(--ink); line-height: 1.55; }
.stop-body { padding: 0 0 14px; max-width: 36em; }
.stop-desc { font-size: 18px; }
.stop-notes { margin-top: 8px; }
.stop-notes li { font-size: 14px; line-height: 1.7; opacity: 0.88; padding-left: 1em; text-indent: -1em; }
.stop-notes li::before { content: "※"; margin-right: 2px; }
.photo-btn { margin-top: 10px; padding: 6px 16px; font-size: 16px; }

/* Photo dialog */
.photo-dialog {
  width: min(92vw, 560px); max-height: 90vh; margin: auto; padding: 0; overflow: auto;
  background: var(--paper); color: var(--ink); border: 3px solid var(--ink);
}
.photo-dialog::backdrop { background: rgba(22, 32, 58, 0.72); }
.photo-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.photo-img { display: block; width: 100%; max-height: 55vh; object-fit: contain; background: #fff; border: 8px solid #fff; box-shadow: 0 1px 4px rgba(30, 42, 74, 0.45); }
.photo-img[hidden], .photo-status:empty { display: none; }
.photo-status { font-weight: 700; padding: 24px 0; text-align: center; }
.photo-caption { font-weight: 900; font-size: 18px; line-height: 1.5; }
.photo-credit { font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.photo-credit a { color: var(--red-text); }
.photo-close { align-self: flex-end; }

/* Meals and hotel */
.day-foot { margin-top: 20px; max-width: 36em; }
.meals { border-top: 1px solid var(--rule); }
.meals li { display: grid; grid-template-columns: 2em 1fr; gap: 8px; padding: 8px 0; font-size: 17px; line-height: 1.6; }
.meal-label { font-weight: 900; color: var(--red-text); }
.hotel { border-top: 1px solid var(--rule); padding-top: 12px; }
.hotel-label { font-weight: 900; font-size: 15px; color: var(--red-text); }
.hotel-primary { font-weight: 900; font-size: 19px; line-height: 1.5; }
.hotel-note { font-size: 15px; }
.hotel-alt-label { margin-top: 6px; font-size: 15px; font-weight: 700; }
.hotel-alts li { font-size: 16px; line-height: 1.6; }

/* ===== 7. Reminders and footer ===== */
.reminders { padding-top: 48px; padding-bottom: 24px; }
.reminders ul { max-width: 36em; }
.reminders li { font-size: 16px; line-height: 1.8; padding: 8px 0; border-top: 1px solid var(--rule); }
.page-foot { padding-top: 16px; padding-bottom: 48px; font-size: 14px; opacity: 0.85; }

/* ===== 8. Narrow screens ===== */
@media (max-width: 400px) {
  .leg-time { font-size: 30px; }
  .day-numeral { font-size: 80px; }
  .daynav-btn { font-size: 14px; }
  .daynav-btn .nav-date { font-size: 14px; }
}

/* ===== 9. Print ===== */
@page { size: A4; margin: 12mm; }
@media print {
  :root { --paper: #fff; --ink: #1E2A4A; --red-text: #C01E25; --rule: rgba(30, 42, 74, 0.3); color-scheme: light; }
  html, body { background: #fff; color: #1E2A4A; font-size: 12pt; }
  .daynav, .tools, .btn, .photo-dialog, .stop summary::after { display: none !important; }
  .cover, .art, .art svg, .ticket-main, .ticket-stub, .layer, .badge, .today-mark, .stamp-face {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cover { height: 265mm; min-height: 0; break-after: page; }
  .layer-pink { animation: none; }
  .flights { break-after: avoid; }
  .day + .day { break-before: page; }
  .reminders { break-before: page; }
  .stop, .meals, .hotel, .ticket { break-inside: avoid; }
  .day { padding-top: 12px; }
}
</style>
</head>

<script id="core">
(function () {
  var WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  var TAIPEI_OFFSET_MS = 8 * 60 * 60 * 1000; // Taiwan has no DST, so a fixed offset is exact
  var ISO_DATE = /^(\d{4})-(\d{2})-(\d{2})$/;

  function parseIso(isoDate) {
    var m = ISO_DATE.exec(isoDate);
    if (!m) { throw new Error('Expected YYYY-MM-DD, got: ' + isoDate); }
    return { year: +m[1], month: +m[2], day: +m[3] };
  }

  function formatTripDate(isoDate) {
    var p = parseIso(isoDate);
    var weekday = new Date(Date.UTC(p.year, p.month - 1, p.day)).getUTCDay();
    return p.month + '/' + p.day + '（' + WEEKDAYS[weekday] + '）';
  }

  function toMinguoYear(gregorianYear) {
    return gregorianYear - 1911;
  }

  function findTodayIndex(now, isoDates) {
    var ms = now.getTime();
    if (isNaN(ms)) { return -1; }
    var taipeiDay = new Date(ms + TAIPEI_OFFSET_MS).toISOString().slice(0, 10);
    return isoDates.indexOf(taipeiDay);
  }

  var HTTPS_URL = /^https:\/\/[^\s]+$/;

  function isSafeHttpsUrl(value) {
    return typeof value === 'string' && HTTPS_URL.test(value);
  }

  function isFilled(value) {
    return typeof value === 'string' && value.trim() !== '';
  }

  // Returns a normalized photo entry for a stop id, or null when absent/invalid
  function getPhoto(photoData, stopId) {
    if (!photoData || typeof photoData !== 'object') { return null; }
    var entry = photoData[stopId];
    if (!entry || typeof entry !== 'object') { return null; }
    if (!isSafeHttpsUrl(entry.thumbUrl) || !isSafeHttpsUrl(entry.filePage)) { return null; }
    if (!isFilled(entry.author) || !isFilled(entry.license)) { return null; }
    return {
      thumbUrl: entry.thumbUrl,
      filePage: entry.filePage,
      author: entry.author,
      license: entry.license,
      caption: typeof entry.caption === 'string' ? entry.caption : ''
    };
  }

  globalThis.TripCore = {
    isSafeHttpsUrl: isSafeHttpsUrl,
    getPhoto: getPhoto,
    formatTripDate: formatTripDate,
    toMinguoYear: toMinguoYear,
    findTodayIndex: findTodayIndex
  };
})();
</script>

<!-- ===== UI ===== -->
<script id="ui">
(function () {
  var core = globalThis.TripCore;
  var trip = JSON.parse(document.getElementById('trip-data').textContent);
  var TAG_LABELS = { winter: '冬季限定', night: '夜間', free: '自由活動', shopping: '購物', flight: '航班' };
  var photos = JSON.parse(document.getElementById('photo-data').textContent);
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var MEAL_LABELS = [['breakfast', '早'], ['lunch', '午'], ['dinner', '晚']];

  // textContent only: trip data never reaches innerHTML
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function compactDate(isoDate) {
    return core.formatTripDate(isoDate).replace(/[（）]/g, '');
  }

  /* --- Cover meta --- */
  function renderCoverMeta() {
    var first = trip.days[0].date;
    var last = trip.days[trip.days.length - 1].date;
    var year = +first.slice(0, 4);
    var month = +first.slice(5, 7);
    document.getElementById('issue-line').textContent = '民國' + core.toMinguoYear(year) + '年' + month + '月號';
    var short = function (iso) { return +iso.slice(5, 7) + '/' + +iso.slice(8, 10); };
    document.getElementById('cover-period').textContent = year + '/' + short(first) + '–' + short(last);
    document.getElementById('cover-party').textContent = trip.party;
  }

  /* --- Flights --- */
  function renderLeg(point, side) {
    var leg = el('div', 'leg leg-' + side);
    leg.appendChild(el('span', 'leg-time', point.time));
    leg.appendChild(el('span', 'leg-code', point.code));
    leg.appendChild(el('span', 'leg-city', point.city));
    return leg;
  }

  function renderTicket(flight) {
    var ticket = el('article', 'ticket');
    var main = el('div', 'ticket-main');
    var head = el('div', 'ticket-head');
    head.appendChild(el('span', '', flight.label));
    head.appendChild(el('span', 'num', core.formatTripDate(flight.date)));
    var legs = el('div', 'ticket-legs');
    legs.appendChild(renderLeg(flight.from, 'from'));
    legs.appendChild(el('span', 'leg-line'));
    legs.appendChild(renderLeg(flight.to, 'to'));
    main.appendChild(head);
    main.appendChild(legs);
    var stub = el('div', 'ticket-stub');
    stub.appendChild(el('span', 'flight-no', flight.no));
    stub.appendChild(el('span', 'airline', flight.airline));
    ticket.appendChild(main);
    ticket.appendChild(stub);
    return ticket;
  }

  function renderFlights() {
    var box = document.getElementById('tickets');
    trip.flights.forEach(function (f) { box.appendChild(renderTicket(f)); });
  }

  /* --- Photo dialog --- */
  var dialog = document.getElementById('photo-dialog');
  var photoImg = document.getElementById('photo-img');
  var photoStatus = document.getElementById('photo-status');
  var photoTrigger = null;

  function openPhoto(photo, trigger) {
    photoTrigger = trigger;
    document.getElementById('photo-caption').textContent = photo.caption;
    var credit = document.getElementById('photo-credit');
    credit.textContent = '照片：' + photo.author + '，' + photo.license + '，';
    var link = el('a', '', '維基共享資源');
    link.setAttribute('href', photo.filePage);
    link.setAttribute('target', '_blank');
    link.setAttribute('rel', 'noopener');
    credit.appendChild(link);
    photoImg.hidden = true;
    photoImg.setAttribute('alt', photo.caption);
    photoStatus.textContent = '照片載入中…';
    photoImg.setAttribute('loading', 'eager');
    photoImg.setAttribute('decoding', 'async');
    photoImg.setAttribute('src', photo.thumbUrl);
    dialog.showModal();
  }

  function setupPhotoDialog() {
    photoImg.addEventListener('load', function () {
      if (!photoImg.getAttribute('src')) { return; }
      photoStatus.textContent = '';
      photoImg.hidden = false;
    });
    photoImg.addEventListener('error', function () {
      if (!photoImg.getAttribute('src')) { return; }
      photoImg.hidden = true;
      photoStatus.textContent = '目前無法載入照片，請確認網路連線後再試。';
    });
    document.getElementById('photo-close').addEventListener('click', function () { dialog.close(); });
    // Clicks outside the dialog box land on the dialog element itself (the backdrop)
    dialog.addEventListener('click', function (event) {
      var box = dialog.getBoundingClientRect();
      var inside = event.clientX >= box.left && event.clientX <= box.right &&
                   event.clientY >= box.top && event.clientY <= box.bottom;
      if (!inside) { dialog.close(); }
    });
    dialog.addEventListener('close', function () {
      photoImg.removeAttribute('src');
      photoImg.hidden = true;
      if (photoTrigger) { photoTrigger.focus(); photoTrigger = null; }
    });
  }

  /* --- Days --- */
  function renderStamp(stopId) {
    var stamp = el('span', 'stamp');
    var face = el('span', 'stamp-face');
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'stamp-art');
    svg.setAttribute('viewBox', '0 0 64 64');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    var use = document.createElementNS(SVG_NS, 'use');
    use.setAttribute('href', '#ill-' + stopId);
    svg.appendChild(use);
    face.appendChild(svg);
    stamp.appendChild(face);
    stamp.setAttribute('aria-hidden', 'true');
    return stamp;
  }

  function renderStop(stop) {
    var item = el('li');
    var details = el('details', 'stop');
    var summary = el('summary');
    var title = el('span', 'stop-title');
    title.appendChild(el('span', 'stop-name', stop.name));
    stop.tags.forEach(function (tag) {
      var cls = tag === 'winter' || tag === 'night' ? 'badge' : 'badge badge-quiet';
      title.appendChild(el('span', cls, TAG_LABELS[tag] || tag));
    });
    summary.appendChild(renderStamp(stop.id));
    summary.appendChild(title);
    var body = el('div', 'stop-body');
    body.appendChild(el('p', 'stop-desc', stop.desc));
    if (stop.notes.length) {
      var notes = el('ul', 'stop-notes');
      stop.notes.forEach(function (n) { notes.appendChild(el('li', '', n)); });
      body.appendChild(notes);
    }
    var photo = core.getPhoto(photos, stop.id);
    if (photo) {
      var photoBtn = el('button', 'btn photo-btn', '看實景照片');
      photoBtn.type = 'button';
      photoBtn.addEventListener('click', function () { openPhoto(photo, photoBtn); });
      body.appendChild(photoBtn);
    }
    details.appendChild(summary);
    details.appendChild(body);
    item.appendChild(details);
    return item;
  }

  function renderMeals(meals) {
    var list = el('ul', 'meals');
    MEAL_LABELS.forEach(function (pair) {
      var li = el('li');
      li.appendChild(el('span', 'meal-label', pair[1]));
      li.appendChild(el('span', 'meal-text', meals[pair[0]]));
      list.appendChild(li);
    });
    return list;
  }

  function renderHotel(hotel) {
    var box = el('div', 'hotel');
    box.appendChild(el('p', 'hotel-label', '住宿'));
    box.appendChild(el('p', 'hotel-primary', hotel.primary));
    if (hotel.note) { box.appendChild(el('p', 'hotel-note', hotel.note)); }
    if (hotel.alternates.length) {
      box.appendChild(el('p', 'hotel-alt-label', '或同級備選'));
      var alts = el('ul', 'hotel-alts');
      hotel.alternates.forEach(function (a) { alts.appendChild(el('li', '', a)); });
      box.appendChild(alts);
    }
    return box;
  }

  function renderDay(day, index) {
    var section = el('section', 'day wrap');
    section.id = 'day-' + (index + 1);
    section.setAttribute('aria-labelledby', section.id + '-title');
    var head = el('header', 'day-head');
    head.appendChild(el('span', 'day-numeral', String(day.day)));
    var label = el('h2', 'day-label', '第 ' + day.day + ' 天');
    label.id = section.id + '-title';
    head.appendChild(label);
    head.appendChild(el('p', 'day-date', core.formatTripDate(day.date)));
    head.appendChild(el('p', 'day-route', day.route));
    var timeline = el('ol', 'timeline');
    day.stops.forEach(function (s) { timeline.appendChild(renderStop(s)); });
    var foot = el('div', 'day-foot');
    foot.appendChild(renderMeals(day.meals));
    foot.appendChild(renderHotel(day.hotel));
    section.appendChild(head);
    section.appendChild(timeline);
    section.appendChild(foot);
    return section;
  }

  function renderDays() {
    var main = document.getElementById('days');
    trip.days.forEach(function (d, i) { main.appendChild(renderDay(d, i)); });
  }

  /* --- Navigation --- */
  function renderNav() {
    var nav = document.getElementById('daynav');
    trip.days.forEach(function (day, i) {
      var btn = el('button', 'daynav-btn');
      btn.type = 'button';
      btn.dataset.target = 'day-' + (i + 1);
      btn.appendChild(el('span', 'nav-day', '第' + day.day + '天'));
      btn.appendChild(el('span', 'nav-date', compactDate(day.date)));
      btn.addEventListener('click', function () {
        document.getElementById(btn.dataset.target).scrollIntoView();
      });
      nav.appendChild(btn);
    });
  }

  function setActive(id) {
    document.querySelectorAll('.daynav-btn').forEach(function (btn) {
      if (btn.dataset.target === id) { btn.setAttribute('aria-current', 'true'); }
      else { btn.removeAttribute('aria-current'); }
    });
  }

  function observeDays() {
    if (!('IntersectionObserver' in window)) { return; }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { setActive(entry.target.id); }
      });
    }, { rootMargin: '-72px 0px -60% 0px', threshold: 0 });
    document.querySelectorAll('.day').forEach(function (d) { observer.observe(d); });
  }

  function markToday() {
    var index = core.findTodayIndex(new Date(), trip.days.map(function (d) { return d.date; }));
    if (index < 0) { return; }
    var btn = document.querySelectorAll('.daynav-btn')[index];
    btn.appendChild(el('span', 'today-mark', '今天'));
    document.getElementById('day-' + (index + 1)).scrollIntoView();
  }

  /* --- Print --- */
  var savedOpenStates = null;

  function setupPrint() {
    document.getElementById('print-btn').addEventListener('click', function () { window.print(); });
    window.addEventListener('beforeprint', function () {
      var all = document.querySelectorAll('details');
      if (!savedOpenStates) {
        savedOpenStates = Array.prototype.map.call(all, function (d) { return d.open; });
      }
      all.forEach(function (d) { d.open = true; });
    });
    window.addEventListener('afterprint', function () {
      if (!savedOpenStates) { return; }
      var states = savedOpenStates;
      document.querySelectorAll('details').forEach(function (d, i) { d.open = states[i]; });
      savedOpenStates = null;
    });
  }

  /* --- Reminders --- */
  function renderReminders() {
    var list = document.getElementById('reminders');
    trip.reminders.forEach(function (text) { list.appendChild(el('li', '', text)); });
  }

  renderCoverMeta();
  renderFlights();
  renderDays();
  renderNav();
  renderReminders();
  observeDays();
  setupPrint();
  setupPhotoDialog();
  markToday();
})();
</script>
</body>
</html>
